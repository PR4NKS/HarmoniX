version: "3.8"

services:
  harmonix:
    build: .
    container_name: harmonix-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LAVALINK_URI=http://127.0.0.1:2333
      - LAVALINK_PASSWORD=youshallnotpass
      - STREAM_PROXY_HOST=127.0.0.1
      - STREAM_PROXY_PORT=2334
      - DATABASE_PATH=data/bot_database.sqlite3
      - LOG_FILE=logs/bot.log
    ports:
      - "2333:2333"  # Lavalink audio server
      - "2334:2334"  # Internal stream proxy
      - "8080:8080"  # Cloud / Railway health responder
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
